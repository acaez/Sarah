<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="sphere-container">
        <canvas id="sphere" width="220" height="220"></canvas>
    </div>
    <div id="messages"></div>
    <div id="input-area">
        <textarea id="input" placeholder="..." rows="1"></textarea>
        <button id="send">↑</button>
    </div>

    <script>
        // Sphère de particules
        const canvas = document.getElementById("sphere");
        const ctx = canvas.getContext("2d");
        const W = canvas.width, H = canvas.height;
        const cx = W / 2, cy = H / 2;
        const R = 85;
        const NUM = 1800;

        let particles = [];
        let time = 0;
        let talking = false;

        for (let i = 0; i < NUM; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            particles.push({
                theta, phi,
                speed: 0.001 + Math.random() * 0.002,
                offset: Math.random() * Math.PI * 2,
                size: 0.6 + Math.random() * 0.8
            });
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            time += 0.008;

            const pulse = talking ? 1 + 0.08 * Math.sin(time * 8) : 1;

            for (let p of particles) {
                p.theta += p.speed;
                const phi = p.phi + 0.3 * Math.sin(time * 0.5 + p.offset);
                const r = R * pulse;

                const x = cx + r * Math.sin(phi) * Math.cos(p.theta);
                const y = cy + r * Math.sin(phi) * Math.sin(p.theta) * 0.4;
                const z = r * Math.cos(phi);

                const brightness = Math.floor(((z + R) / (2 * R)) * 180 + 40);
                const alpha = 0.4 + (z + R) / (2 * R) * 0.6;

                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${brightness},${brightness},${brightness},${alpha})`;
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }

        draw();

        // Chat
        const messagesEl = document.getElementById("messages");
        const input = document.getElementById("input");
        const send = document.getElementById("send");

        function addMessage(content, role) {
            const div = document.createElement("div");
            div.classList.add("message", role);
            div.textContent = content;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            input.style.height = "auto";
            addMessage(text, "user");
            talking = true;

            const res = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: text})
            });
            const data = await res.json();
            talking = false;
            addMessage(data.response, "sarah");
        }

        send.addEventListener("click", sendMessage);
        input.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = input.scrollHeight + "px";
        });
    </script>
</body>
</html>
